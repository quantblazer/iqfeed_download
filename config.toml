# IQFeed continuous futures downloader.
# Symbols are explicit on purpose: verify each one with
#   iqfeed-dl probe <symbol> --timeframe 1d
# "#C" = back-adjusted continuous, "#" = unadjusted front month.
# CME/CBOT products use an "@" prefix (@MES#C); NYMEX/COMEX use "Q" (QMCL#C, QMGC#C).
# Micro futures only (full-size ES/NQ/YM/RTY/CL/GC and the bond futures ZN/ZB were removed).

[iqfeed]
host = "127.0.0.1"
lookup_port = 9100
timeout_seconds = 60

[output]
directory = "./data/continuous"
reports_dir = "./reports"
logs_dir = "./logs"

[history]
start_date = "2010-01-01"
end_date = "today"
timeframes = ["1d", "1h"]   # any subset
# IQFeed's native daily history (HDX/HDT) currently fails on this account, so daily bars are
# built from hourly bars. Use "iqfeed" to switch back once native daily works.
daily_source = "hourly"
# Eastern time the trade day starts: CME Globex 18:00 (= 17:00 CT). The bar is dated by the
# day it ends on. Set to match your MultiCharts session template.
session_start = "18:00"

[[symbols]]
name = "MES"
iqfeed_symbol = "@MES#C"

[[symbols]]
name = "MNQ"
iqfeed_symbol = "@MNQ#C"

[[symbols]]
name = "MYM"
iqfeed_symbol = "@MYM#C"

[[symbols]]
name = "M2K"
iqfeed_symbol = "@M2K#C"

[[symbols]]
name = "MCL"
iqfeed_symbol = "QMCL#C"

[[symbols]]
name = "MGC"
iqfeed_symbol = "QMGC#C"
